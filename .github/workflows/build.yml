name: Build Custom Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  # Bazzite regularly ships a new kernel, and linuwu_sense is an out-of-tree
  # module compiled against that kernel, so rebuild weekly.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The BlueBuild action checks the repository out itself.
      - name: Build with BlueBuild
        uses: blue-build/github-action@v1
        with:
          # Relative to config/ (or recipes/), not the repository root.
          recipe: recipe.yml
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          # Unsigned image; see README for how to enable signing.
          build_opts: "--no-sign"
