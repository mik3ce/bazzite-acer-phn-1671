# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-acer-phn-1671
description: Bazzite (GNOME, NVIDIA open) with the linuwu_sense driver for the Acer Predator PHN16-71
base-image: ghcr.io/ublue-os/bazzite-gnome-nvidia-open
image-version: stable

modules:
  # Kernel module loading config, shutdown unit and sysfs permissions.
  - type: files
    files:
      - source: system
        destination: /

  # Build and install linuwu_sense for the kernel in this image.
  - type: script
    scripts:
      - build-linuwu-sense.sh
