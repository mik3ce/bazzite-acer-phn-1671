# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: bazzite-predator
description: Immagine Bazzite personalizzata con modulo linuwu_sense per Acer Predator PHN16-71
base-image: ghcr.io/ublue-os/bazzite-nvidia
image-version: stable

modules:
  - type: files
    files:
      - usr: /usr

  - type: containerfile
    snippets:
      - COPY Containerfile /tmp/Containerfile
      - RUN bash -c "chmod +x /tmp/Containerfile && /tmp/Containerfile"

  - type: default-flatpaks
    system:
      install:
        - org.coolercontrol.CoolerControl